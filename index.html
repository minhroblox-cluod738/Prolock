*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#05060b;color:#fff;font-family:Roboto,system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;background:radial-gradient(40% 30% at 25% 20%,#1d4ed855,transparent),radial-gradient(40% 30% at 80% 80%,#7c3aed44,transparent);animation:au 12s ease-in-out infinite alternate}
@keyframes au{to{transform:translate(4%,-3%) scale(1.1)}}
#cv{position:fixed;inset:0;z-index:0;pointer-events:none}
.scr{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transform:scale(.95);filter:blur(10px);transition:.5s}
.scr.on{opacity:1;visibility:visible;transform:none;filter:none}
.w{margin:auto 0;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center}
.av{width:124px;height:124px;border-radius:50%;position:relative;flex:none;will-change:transform;animation:fl 4s ease-in-out infinite}
.av::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--bl),var(--pu),#f43f5e,var(--bl));animation:spin 3s linear infinite;will-change:transform;backface-visibility:hidden}
.av::after{content:"";position:absolute;inset:-16%;border-radius:50%;z-index:-2;background:radial-gradient(circle,#8b5cf6aa 0,#38bdf855 42%,transparent 68%);animation:gl 2.4s ease-in-out infinite alternate;will-change:transform,opacity}
.av i{position:absolute;inset:0;border-radius:50%;background:var(--av) center/cover,#000;border:3px solid #05060b;transform:translateZ(0);backface-visibility:hidden}
.av.sm{width:100px;height:100px}
.wg{position:absolute;width:89%;height:81%;top:-5%;z-index:-1;overflow:visible;pointer-events:none;will-change:transform}
.wg.r{left:94%;transform-origin:4% 58%;animation:fr 3s ease-in-out infinite alternate}
.wg.l{left:-83%;transform-origin:96% 58%;animation:fle 3s ease-in-out infinite alternate}
.cr{position:absolute;width:58%;height:38%;left:21%;top:-25%;z-index:3;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 7px #fbbf24aa) drop-shadow(0 2px 2px #0008)}
.scr:not(.on) .av,.scr:not(.on) .av *,.scr:not(.on) .av::before,.scr:not(.on) .av::after{animation-play-state:paused}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes gl{from{opacity:.55;transform:scale(.94)}to{opacity:1;transform:scale(1.08)}}
@keyframes fl{50%{transform:translate3d(0,-6px,0)}}
@keyframes fr{to{transform:rotate(-7deg)}}
@keyframes fle{to{transform:rotate(7deg)}}
.t{font-weight:900;letter-spacing:.26em;margin-right:-.26em;background:linear-gradient(90deg,#fff,var(--bl),var(--pu),#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
.lab{letter-spacing:.22em;font-weight:700;font-size:14px;color:#cbd5e1;margin:18px 0 12px;text-align:center}
.hint{margin-top:70px;color:#8a8fa0;font-size:15px;animation:bl 2s ease-in-out infinite}
@keyframes bl{50%{opacity:.25}}
.btn{position:relative;overflow:hidden;border:0;color:#fff;font:700 15px Roboto,system-ui,sans-serif;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.rp{position:absolute;border-radius:50%;background:#fff5;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.card{width:100%;max-width:440px;background:#16161aee;border:1px solid #ffffff14;border-radius:22px;box-shadow:0 10px 40px #0008}
#ky{width:100%;height:54px;border-radius:14px;border:1px solid #38bdf844;background:#0b1220cc;color:#fff;text-align:center;font:600 16px Roboto,system-ui,sans-serif;letter-spacing:.1em;outline:0;transition:.3s;user-select:text}
#ky:focus{border-color:var(--bl);box-shadow:0 0 0 3px #38bdf833,0 0 24px #38bdf855}
#ky::placeholder{color:#7b8496;letter-spacing:0}
#lg{width:100%;height:54px;margin-top:14px;border-radius:14px;background:linear-gradient(90deg,#1d4ed8,#0ea5e9);box-shadow:0 0 24px #0ea5e988}
#lg::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff5,transparent);transform:translateX(-150%) skewX(-20deg);animation:sw 3s infinite;will-change:transform}
@keyframes sw{to{transform:translateX(350%) skewX(-20deg)}}
.shake{animation:sk .45s}
@keyframes sk{20%,60%{translate:-9px}40%,80%{translate:9px}}
.bk{background:none;color:#e5e7eb;padding:8px 4px}
.top{width:100%;max-width:440px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.top>:last-child{justify-self:end}
.top .t{font-size:20px;text-align:center}
.top small{display:block;text-align:center;font-size:10px;letter-spacing:.3em;color:#8a90a0;margin-top:2px}
.nm{font-size:22px;font-weight:800;margin-top:14px;text-shadow:0 0 18px #38bdf8aa}
.pill{margin:8px 0 16px;font-size:12px;color:#9ca3af;display:flex;gap:8px;align-items:center;background:#ffffff0d;border:1px solid #ffffff14;padding:6px 14px;border-radius:99px}
.pill b{width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 10px var(--gr);animation:bl 1.5s infinite}
.r{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #ffffff0d;transition:background .3s}
.r:last-child{border:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#ffffff0d;transition:.3s}
.r b{flex:1;font-size:15px;letter-spacing:.02em;text-align:left}
.r.on{background:linear-gradient(90deg,#22c55e1f,transparent)}
.r.on .ic{background:#22c55e22;box-shadow:0 0 16px #22c55e66}
.sw{width:56px;height:30px;border-radius:15px;background:#3a3a40;position:relative;transition:.3s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0009;transition:.35s cubic-bezier(.4,1.7,.5,1)}
.r.on .sw{background:var(--gr);box-shadow:0 0 16px #22c55e99}
.r.on .sw::after{transform:translateX(26px)}
.dis{opacity:.4;pointer-events:none;filter:grayscale(.6)}
.go .r{animation:up .55s backwards;animation-delay:calc(var(--i)*70ms)}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
.seg{width:100%;max-width:440px;height:62px;border-radius:16px;background:#26262b;display:grid;grid-template-columns:1fr 1fr;position:relative;border:1px solid #ffffff14;overflow:hidden}
.seg i{position:absolute;inset:0 50% 0 0;background:linear-gradient(135deg,#4ade80,#16a34a);box-shadow:0 0 22px #22c55e88;transition:.4s cubic-bezier(.5,1.4,.5,1)}
.seg.off i{transform:translateX(100%);background:linear-gradient(135deg,#f87171,#b91c1c);box-shadow:0 0 22px #ef444488}
.seg button{position:relative;z-index:1;background:none;font-size:17px;letter-spacing:.25em;color:#8b8f99;transition:.3s}
.seg button.a{color:#fff}
#md{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:.3s}
#md.show{opacity:1;visibility:visible}
.bx{width:min(88vw,420px);border-radius:22px;overflow:hidden;background:#111;border:1px solid #ffffff1f;box-shadow:0 0 50px #38bdf844;transform:scale(.85) translateY(20px);transition:.4s cubic-bezier(.3,1.5,.5,1)}
#md.show .bx{transform:none}
#mt{padding:18px;text-align:center;font-size:19px;font-weight:800;background:linear-gradient(90deg,#2563eb,#7c3aed)}
#tm{margin:14px;padding:14px;height:200px;overflow:hidden;border-radius:12px;background:#07070a;border:1px solid #ffffff14;font:12.5px/1.7 ui-monospace,Menlo,monospace;color:#34d399}
#tm b{color:var(--bl);margin-right:6px}
.pg{height:6px;margin:0 14px 16px;border-radius:9px;background:#ffffff14;overflow:hidden}
#pb{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bl),var(--gr));box-shadow:0 0 12px var(--gr);transition:.3s}
#tc{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;z-index:99;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}

<script>
const $=id=>document.getElementById(id),sl=ms=>new Promise(r=>setTimeout(r,ms));
const KEYS=['PROLOCK','DUCMIN']; // ← đổi / thêm key đăng nhập ở đây
const F=[['💀','EXTRACTLY'],['📂','REG FILES'],['🚀','BOOST RAM'],['⚙️','FIX RUNG'],['❄️','NHẸ TÂM PLUS'],['⚡️','FIX LAG'],['🎯','GHÌM TÂM']];
const L={
'EXTRACTLY':['Scanning resource packages...','Extracting cache data...','Optimizing file structure...'],
'REG FILES':['Reading touch configuration...','Calibrating touch sampling rate...','Injecting registry keys...','Applying smooth tracking sensitivity...'],
'BOOST RAM':['Analyzing memory usage...','Releasing background processes...','Allocating performance buffer...'],
'FIX RUNG':['Detecting touch jitter...','Stabilizing input signal...','Applying anti-shake filter...'],
'NHẸ TÂM PLUS':['Loading light-aim profile...','Reducing drag resistance...','Smoothing crosshair response...'],
'FIX LAG':['Measuring frame latency...','Clearing network buffer...','Optimizing frame pacing...'],
'GHÌM TÂM':['Reading crosshair settings...','Tuning aim stability...','Applying lock sensitivity...']};
let busy=0;

function toast(m,t='info',ic){const d=document.createElement('div');d.className='ts '+t;d.innerHTML=`<span>${ic||{ok:'✅',err:'⚠️',info:'🔔'}[t]}</span>${m}`;$('tc').prepend(d);navigator.vibrate&&navigator.vibrate(t=='err'?[40,40,40]:25);setTimeout(()=>d.remove(),3050)}

const ls=$('ls');
F.forEach(([ic,n],i)=>{const r=document.createElement('div');r.className='r btn';r.style.setProperty('--i',i);r.innerHTML=`<span class="ic">${ic}</span><b>${n}</b><span class="sw"></span>`;r.onclick=()=>tg(i);ls.appendChild(r)});
const rows=[...ls.children],cnt=()=>$('cnt').textContent=document.querySelectorAll('.r.on').length;

function tg(i){if(busy)return;const r=rows[i];if(r.classList.contains('on')){r.classList.remove('on');cnt();toast(`Đã tắt ${F[i][1]}`,'info','🔴')}else inst(i)}
async function inst(i){busy=1;const[ic,n]=F[i],t=$('tm');$('mt').textContent=`${ic} Cài đặt ${n}`;t.innerHTML='';$('pb').style.width=0;$('md').classList.add('show');await sl(450);
const a=[...L[n],`${n} installed successfully!`];
for(let k=0;k<a.length;k++){const d=document.createElement('div');d.innerHTML='<b>$</b>';t.appendChild(d);for(const c of a[k]){d.append(c);await sl(14)}$('pb').style.width=(k+1)/a.length*100+'%';t.scrollTop=1e5;await sl(280)}
await sl(500);$('md').classList.remove('show');rows[i].classList.add('on');cnt();toast(`Đã bật ${n}`,'ok',ic);busy=0}

function mst(v){if(busy)return;$('sg').classList.toggle('off',!v);$('on').classList.toggle('a',!!v);$('off').classList.toggle('a',!v);ls.classList.toggle('dis',!v);if(!v){rows.forEach(r=>r.classList.remove('on'));cnt()}toast(v?'STARTING FILES: ON':'Đã tắt toàn bộ chức năng','info',v?'🟢':'🔴')}
$('on').onclick=()=>mst(1);$('off').onclick=()=>mst(0);

const go=id=>{document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id));if(id=='s3'){ls.classList.remove('go');void ls.offsetWidth;ls.classList.add('go')}$('sh').classList.remove('show')};
$('s1').onclick=()=>go('s2');$('b2').onclick=()=>go('s1');
$('bk').onclick=()=>{go('s2');toast('Đã quay lại màn hình xác thực','info','↩️')};

try{$('ky').value=localStorage.getItem('pl')||''}catch(e){}
function bad(m){toast(m,'err');const f=$('fm');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}
$('lg').onclick=()=>{const v=$('ky').value.trim().toUpperCase(),b=$('lg');if(b.dataset.l)return;if(!v)return bad('Vui lòng nhập Key!');
b.dataset.l=1;b.textContent='⏳ ĐANG XÁC THỰC...';
setTimeout(()=>{delete b.dataset.l;b.textContent='🚀 ĐĂNG NHẬP (LOGIN)';
if(KEYS.includes(v)){try{localStorage.setItem('pl',v)}catch(e){}toast('Xác thực thành công!','ok','🔓');go('s3');setTimeout(()=>toast('Chào mừng bạn đến với PRO LOCK!','info','💎'),700)}
else bad('Key không hợp lệ hoặc đã hết hạn!')},1400)};

$('mn').onclick=e=>{e.stopPropagation();$('sh').classList.toggle('show')};
document.addEventListener('click',e=>{if(!e.target.closest('#sh'))$('sh').classList.remove('show')});
$('sh').onclick=e=>{const a=e.target.dataset.a;if(!a||busy)return;$('sh').classList.remove('show');
if(a==3){go('s2');toast('Đã đăng xuất','info','🚪');return}
if(a==1&&$('sg').classList.contains('off'))mst(1);
rows.forEach(r=>r.classList.toggle('on',a==1));cnt();toast(a==1?'Đã bật tất cả chức năng':'Đã tắt tất cả chức năng',a==1?'ok':'info',a==1?'🚀':'❄️')};

/* ===== VÀO GAME ===== */
// ↓ đổi package / scheme / link store ở đây nếu cần
const GAME={
 android:{ff:'com.dts.freefireth',max:'com.dts.freefiremax',vn:'com.garena.ffvn'},
 ios:{ff:{scheme:'freefire://',store:'https://apps.apple.com/app/id1300146617'},
      max:{scheme:'freefiremax://',store:'https://apps.apple.com/app/id1480516829'},
      vn:{scheme:'freefirevn://',store:'https://apps.apple.com/vn/app/free-fire-vn/id6788307486'}}
};
const NAME={ff:'Free Fire',max:'Free Fire Max',vn:'Free Fire VN'};
let gs={os:(/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1))?'ios':'android',ver:'vn'};
try{const x=JSON.parse(localStorage.getItem('plg')||'null');if(x&&(x.os=='android'||x.os=='ios')&&['ff','max','vn'].includes(x.ver))gs=x}catch(e){}
function gsync(){document.querySelectorAll('#gp .op').forEach(o=>o.classList.toggle('a',gs[o.dataset.k]==o.dataset.v))}
gsync();
$('gp').onclick=e=>{const o=e.target.closest('.op');if(!o)return;gs[o.dataset.k]=o.dataset.v;gsync();try{localStorage.setItem('plg',JSON.stringify(gs))}catch(_){}};
$('gg').onclick=()=>{const b=$('gg');if(b.dataset.l)return;const{os,ver}=gs,nm=NAME[ver];b.dataset.l=1;b.textContent='⏳ ĐANG MỞ '+nm.toUpperCase()+'...';
toast(`Đang vào ${nm} (${os=='ios'?'iOS':'Android'})...`,'info','🚀');
let left=0;const lv=()=>{if(document.hidden)left=1};document.addEventListener('visibilitychange',lv);addEventListener('pagehide',lv);
if(os=='android'){const p=GAME.android[ver],sc=GAME.ios[ver].scheme,fb=encodeURIComponent('https://play.google.com/store/apps/details?id='+p);
 // Android: mở thẳng bằng scheme của game (giống chế độ iOS), không cần bấm "Chơi" trên CH Play
 const playUrl=`intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${p};S.browser_fallback_url=${fb};end`;
 const directUrl=`intent://#Intent;scheme=${sc.replace('://','')};package=${p};S.browser_fallback_url=${fb};end`;
 const ifr=u=>{const f=document.createElement('iframe');f.style.display='none';f.src=u;document.body.appendChild(f);setTimeout(()=>f.remove(),3000)};
 if(/; wv\)|Version\/[\d.]+ Chrome/i.test(navigator.userAgent)){
  ifr(sc);
  setTimeout(()=>{if(!left)ifr(playUrl)},1600);
  setTimeout(()=>{if(!left)toast(`Không mở được ${nm}. Kiểm tra game đã cài chưa.`,'err')},2700)}
 else location.href=directUrl}
else{const f=document.createElement('iframe');f.style.display='none';f.src=GAME.ios[ver].scheme;document.body.appendChild(f);setTimeout(()=>f.remove(),3000)}
setTimeout(()=>{document.removeEventListener('visibilitychange',lv);removeEventListener('pagehide',lv);delete b.dataset.l;b.textContent='🚀 VÀO GAME NGAY';
 if(!left&&os=='ios'){toast(`Không mở được ${nm}. Đang mở App Store...`,'err');setTimeout(()=>{location.href=GAME.ios[ver].store},1200)}},2800)};
